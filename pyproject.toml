[project]
name = "linkedin-to-notion-jobs"
version = "0.1.0"
description = "LinkedIn to Notion daily AI-engineer job scraper"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "beautifulsoup4",
    "keyring",
]

[project.scripts]
jobs = "jobs.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
